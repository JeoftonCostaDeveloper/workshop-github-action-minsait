name: CD - Deploy Node App

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Construindo aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm install

      - name: Build artifact
        run: |
          tar -czf app.tar.gz src package.json package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.tar.gz

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.APP_PATH }}
            cd ${{ secrets.APP_PATH }}

            rm -rf src package.json package-lock.json
            tar -xzf app.tar.gz

            npm install --production

            pm2 start src/app.js --name simple-crud || pm2 restart simple-crud
